# Zero Dependency Hackathon 2026 — submission metadata
track = "A"
pitch = "Offline supply-chain X-ray for Python environments: verifies installed files against installer hashes, explains why every package is there, and names the ones the standard library could delete."

team = "Import Error"
project = "BareCode"
language = "python"
runtime = "CPython 3.14 (works on >=3.11)"

# Bonus challenges we claim. See STDLIB.md and PACKAGE-KILLER.md.
bonuses = ["stdlib-log", "package-killer", "reproducible-build"]

# Bonuses we deliberately do NOT claim, and why -- stated up front rather than
# half-done, per the organisers' "don't half-do all four".
[bonuses-declined]
single-file = "Rejected: a single 3k-line file would cost more under Code Quality & Idiom (25%) than the +5 gains."

[bonus-evidence]
stdlib-log = "STDLIB.md — 17 substitutions, each with rationale and the limitation it inherits."
package-killer = "PACKAGE-KILLER.md — feature matrices vs pipdeptree, pip-licenses, deptry/pipreqs, including what they still do better."
reproducible-build = "`make repro` builds twice and asserts byte-identical output, printing both SHA-256 hashes. Timestamps are normalised to a fixed epoch during staging, so the artifact is a pure function of source content: sha256 efce2ebefdb2952532aad19195bbf8327c60378de1eacbbb81fb9401f9f00036, reproducible even across a fresh clone into a different directory."
